name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - dev
      - develop
      - main

jobs:
  build:

    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
        backend: ["tensorflow", "torch"]

    env:
      KERAS_BACKEND: ${{ matrix.backend }}

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements/requirements.txt ]; then pip install -r requirements/requirements.txt; fi
          if [ -f requirements/tests_requirements.txt ]; then pip install -r requirements/tests_requirements.txt; fi
          pip install -e .[${{ matrix.backend }}]
      - name: Lint with ruff
        run: |
          ruff check ./tsgm
      - name: Test with pytest
        run: |
          pytest

      - name: Generate coverage report
        if: success()
        run: |
          pip install coverage
          coverage run -m pytest
          coverage xml
      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@v3
        if: success()
        with:
          file: coverage.xml

  jax-unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      KERAS_BACKEND: jax
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install JAX backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[jax]' -r requirements/tests_requirements.txt
      - name: Run JAX unit tests
        run: |
          pytest tests/test_jax_backend.py \
            tests/test_dataset.py tests/test_simulator.py tests/test_archive_security.py \
            tests/test_metrics.py::test_statistics tests/test_metrics.py::test_distance_metric \
            tests/test_vae.py::test_vae_fit_updates_weights \
            tests/test_abc.py::test_abc_rejection_sampler_model_based_simulator
